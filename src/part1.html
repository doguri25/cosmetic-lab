<title>내 화장품 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FBF9F4;--surface:#FFFFFF;--surface2:#F2F0EA;--surface3:#E9E6DD;
  --text:#1B1C19;--muted:#5A5D55;--line:#E4E0D6;--line2:#C9C6BC;
  --primary:#3D6B4F;--on-primary:#FFFFFF;--primary-c:#CFE8D5;--on-primary-c:#10301C;
  --secondary:#B0562A;--secondary-c:#FFDCC9;--on-secondary-c:#3B1A07;
  --ok-bg:#DFF2E1;--ok-fg:#1E5B23;--warn-bg:#FFECC7;--warn-fg:#7A4500;--bad-bg:#FBE0DE;--bad-fg:#8C1D18;--bad-line:#B3261E;
  --water-bg:#DCEEFB;--water-fg:#0B4A73;--oil-bg:#E8E0F7;--oil-fg:#3F2A73;--act-bg:#D6EEDC;--act-fg:#14532D;
  --surf-bg:#D2EFEA;--surf-fg:#0D4F47;--other-bg:#ECEAE4;--other-fg:#3F4239;--frag-bg:#FBEFC2;--frag-fg:#5C4300;
  --water-dot:#4A90C8;--oil-dot:#7B5EA7;--act-dot:#3D8B4F;--surf-dot:#2A9D8F;--other-dot:#8A8D84;--frag-dot:#D9A400;
  --shadow:0 6px 20px rgba(27,28,25,.08);--focus:#2F5D8A;--scrim:rgba(27,28,25,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141614;--surface:#1D201D;--surface2:#262A26;--surface3:#30352F;
    --text:#ECEAE3;--muted:#A9ADA3;--line:#363B36;--line2:#4A504A;
    --primary:#8FC7A2;--on-primary:#0F2E1B;--primary-c:#2B4A38;--on-primary-c:#D6F0DE;
    --secondary:#F0A27C;--secondary-c:#4A2A18;--on-secondary-c:#FFD8C2;
    --ok-bg:#1F3D25;--ok-fg:#A9E0B3;--warn-bg:#4A3410;--warn-fg:#FFD28A;--bad-bg:#4A1E1B;--bad-fg:#FFB4AB;--bad-line:#E57373;
    --water-bg:#173247;--water-fg:#A8D4F5;--oil-bg:#2E2546;--oil-fg:#CDBBF0;--act-bg:#1D3A27;--act-fg:#A9E0B3;
    --surf-bg:#153A36;--surf-fg:#9FE0D6;--other-bg:#30352F;--other-fg:#CFD3C9;--frag-bg:#423712;--frag-fg:#F3D98B;
    --shadow:0 6px 20px rgba(0,0,0,.45);--focus:#9CC3E8;--scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141614;--surface:#1D201D;--surface2:#262A26;--surface3:#30352F;
  --text:#ECEAE3;--muted:#A9ADA3;--line:#363B36;--line2:#4A504A;
  --primary:#8FC7A2;--on-primary:#0F2E1B;--primary-c:#2B4A38;--on-primary-c:#D6F0DE;
  --secondary:#F0A27C;--secondary-c:#4A2A18;--on-secondary-c:#FFD8C2;
  --ok-bg:#1F3D25;--ok-fg:#A9E0B3;--warn-bg:#4A3410;--warn-fg:#FFD28A;--bad-bg:#4A1E1B;--bad-fg:#FFB4AB;--bad-line:#E57373;
  --water-bg:#173247;--water-fg:#A8D4F5;--oil-bg:#2E2546;--oil-fg:#CDBBF0;--act-bg:#1D3A27;--act-fg:#A9E0B3;
  --surf-bg:#153A36;--surf-fg:#9FE0D6;--other-bg:#30352F;--other-fg:#CFD3C9;--frag-bg:#423712;--frag-fg:#F3D98B;
  --shadow:0 6px 20px rgba(0,0,0,.45);--focus:#9CC3E8;--scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 45%, transparent)}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

.app{min-height:100%;display:flex;flex-direction:column}
.rail{display:none}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:96px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;background:var(--surface2);position:sticky;top:0;height:100vh}
  main{max-width:1120px;padding:0 32px 48px}
  .bottomnav{display:none!important}
}
.rail .logo{width:40px;height:40px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:500;padding:4px 0;width:72px;border-radius:12px;white-space:nowrap}
.navitem .pill{display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:16px}
.navitem.on{color:var(--on-primary-c);font-weight:700}
.navitem.on .pill{background:var(--primary-c)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface2);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.bottomnav .navitem{width:auto}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:4px;min-height:64px;padding:10px 0 6px;background:var(--bg)}
.topbar h1{font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.iconbtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:36px;height:36px}
.iconbtn.outl{border:1px solid var(--line2);color:var(--primary)}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.s{width:18px;height:18px}
.icon.xs{width:14px;height:14px;stroke-width:2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:24px;border:0;font-weight:700;font-size:15px;text-decoration:none;background:var(--primary);color:var(--on-primary)}
.btn.lg{min-height:56px;border-radius:28px;font-size:16px}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.outl{background:transparent;border:1px solid var(--line2);color:var(--primary)}
.btn.text{background:transparent;color:var(--primary);min-height:40px;padding:0 12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.warn{background:var(--secondary-c);color:var(--on-secondary-c)}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card.tint{background:var(--surface2);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.h2{font-size:16px;font-weight:700}
.h3{font-size:15px;font-weight:700}
.lead{font-size:24px;font-weight:700;line-height:1.3}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:13px;font-weight:500;white-space:nowrap}
.chip.sel{background:var(--primary-c);border-color:transparent;color:var(--on-primary-c);font-weight:700}
.chip.sm{height:28px;font-size:12px;padding:0 10px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.g0{background:var(--ok-bg);color:var(--ok-fg)}
.badge.g1{background:var(--warn-bg);color:var(--warn-fg)}
.badge.g2{background:var(--bad-bg);color:var(--bad-fg)}
.badge.a25{background:transparent;border:1px solid var(--bad-line);color:var(--bad-fg)}

.ichip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;background:var(--other-bg);color:var(--other-fg)}
.ichip.r-water{background:var(--water-bg);color:var(--water-fg)}
.ichip.r-oil{background:var(--oil-bg);color:var(--oil-fg)}
.ichip.r-act{background:var(--act-bg);color:var(--act-fg)}
.ichip.r-surf{background:var(--surf-bg);color:var(--surf-fg)}
.ichip.r-frag{background:var(--frag-bg);color:var(--frag-fg)}
.ichip.r-other{background:var(--other-bg);color:var(--other-fg)}
.ichip.r-none{background:transparent;border-color:var(--line2);color:var(--muted);border-style:dashed}
.ichip.warn{box-shadow:inset 0 0 0 1px var(--warn-fg)}
.ichip.bad{border-color:var(--bad-line);box-shadow:inset 0 0 0 1px var(--bad-line);font-weight:700}
.ichip.pos{font-weight:700}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0;background:var(--other-dot)}
.dot.water{background:var(--water-dot)}.dot.oil{background:var(--oil-dot)}.dot.act{background:var(--act-dot)}.dot.surf{background:var(--surf-dot)}.dot.frag{background:var(--frag-dot)}.dot.other{background:var(--other-dot)}

.field{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:24px;background:var(--surface2);color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--text);font-size:14px}
.field.box{border-radius:12px;background:var(--surface);border:1px solid var(--line2);position:relative}
.field.box label{position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface);font-size:11.5px;color:var(--primary)}
textarea{width:100%;min-height:120px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);resize:vertical;line-height:1.5;font-size:14px}

.big2 a{display:flex;flex-direction:column;justify-content:space-between;min-height:160px;padding:18px;border-radius:24px;text-decoration:none}
.big2 .ic{width:48px;height:48px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.big2 .t{font-size:18px;font-weight:700}
.big2 .d{font-size:13px;line-height:1.4}
.mk{background:var(--primary-c);color:var(--on-primary-c)}
.mk .ic{color:var(--primary)}
.an{background:var(--secondary-c);color:var(--on-secondary-c)}
.an .ic{color:var(--secondary)}

.saved-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;text-align:left;border-style:solid}
.saved-item .thumb{width:52px;height:52px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.saved-item .thumb svg{width:44px;height:44px}
.saved-item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.typecard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.typecard.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.typecard .n{font-weight:700}
.typecard .d{font-size:12.5px;color:var(--muted)}

.beaker-card{display:flex;gap:16px;align-items:center}
.beaker-card svg{width:88px;height:122px;flex-shrink:0}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend .between strong{font-weight:700}
.gauge{margin-top:4px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.gauge.ok{color:var(--ok-fg)}.gauge.warn{color:var(--warn-fg)}.gauge.bad{color:var(--bad-fg)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.bar span{display:block;height:100%}

.irow{display:grid;grid-template-columns:10px minmax(0,1fr) 84px 36px;grid-template-areas:"dot name pct del" "dot slider slider slider";column-gap:10px;row-gap:0;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pctwrap{grid-area:pct;display:flex;align-items:center;gap:3px;justify-self:end}
.pctwrap input{width:60px;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);text-align:right;padding:0 6px;font-weight:700;font-size:14px;color:var(--text);-moz-appearance:textfield}
.pctwrap input::-webkit-outer-spin-button,.pctwrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pctwrap span{font-size:13px;color:var(--muted)}
.ranges{width:100%;border-collapse:collapse;font-size:13.5px}
.ranges th,.ranges td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.ranges th{font-size:12px;color:var(--muted);font-weight:500}
.ranges td.r,.ranges th.r{text-align:right}
.irow .dot{grid-area:dot}
.irow .iname{grid-area:name;background:none;border:0;text-align:left;padding:0;display:flex;align-items:baseline;gap:8px;min-width:0}
.irow .iname span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .iname small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.irow .pct{grid-area:pct;text-align:right;font-weight:700;font-size:14px}
.irow .del{grid-area:del;justify-self:end}
.irow input[type=range]{grid-area:slider;width:100%;margin:2px 0 0;accent-color:var(--primary);height:28px}
@media (min-width:600px){
  .irow{grid-template-columns:10px 190px minmax(0,1fr) 84px 36px;grid-template-areas:"dot name slider pct del";row-gap:0}
  .irow input[type=range]{margin:0}
}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.alert.warn{background:var(--warn-bg);color:var(--warn-fg)}
.alert.bad{background:var(--bad-bg);color:var(--bad-fg)}
.alert.ok{background:var(--ok-bg);color:var(--ok-fg)}
.alert.info{background:var(--water-bg);color:var(--water-fg)}
.alert .icon{margin-top:1px}

.mix-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.palette-host{display:none}
@media (min-width:900px){
  .mix-grid{grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .palette-host{display:block;position:sticky;top:80px}
  .palette-host .palette{max-height:calc(100vh - 100px)}
  .fab-add{display:none}
}
.palette{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 12px 10px;overflow:hidden}
.palette .list{overflow-y:auto;display:flex;flex-direction:column;flex:1;min-height:0}
.palette > .between,.palette > .field,.palette > .chiprow{flex-shrink:0}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;min-height:52px}
.prow:hover{background:var(--surface2)}
.prow .info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.prow .info .t{display:flex;flex-direction:column;min-width:0;flex:1}
.prow .info .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .info small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard{display:flex;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;align-items:flex-start}
.gcard .thumb{width:64px;height:64px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gcard .thumb svg{width:56px;height:56px}
.gcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.like{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.like.on{background:var(--secondary-c);border-color:transparent;color:var(--on-secondary-c)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface2)}
.stat3 b{font-size:20px;line-height:1}
.stat3 span{font-size:11.5px;color:var(--muted)}
.prow .add{width:36px;height:36px;border-radius:18px;border:0;background:var(--surface2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:88%;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow);transform:translateY(102%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.25,1.04),visibility .42s;display:flex;flex-direction:column;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none;visibility:visible}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
.sheet .body{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.sheet .palette{border:0;padding:0;max-height:70vh}
@media (min-width:900px){
  .sheet{left:auto;right:32px;bottom:32px;width:460px;border-radius:24px;max-height:80vh;transform:translateY(20px) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1.05),opacity .22s,visibility .3s}
  .sheet.open{transform:none;opacity:1}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade3 div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:16px}
.grade3 b{font-size:22px;font-weight:700;line-height:1}
.grade3 span{font-size:12px;font-weight:500}
.g0bg{background:var(--ok-bg);color:var(--ok-fg)}.g1bg{background:var(--warn-bg);color:var(--warn-fg)}.g2bg{background:var(--bad-bg);color:var(--bad-fg)}.g0bg.zero,.g1bg.zero,.g2bg.zero{background:var(--surface2);color:var(--muted)}
.skin4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skin4 div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;text-align:center}
.skin4 b{font-size:13px}
.skin4 span{font-size:11.5px}
.ai-box{white-space:pre-wrap;font-size:14px;line-height:1.6}
.ai-box:empty::before{content:'';}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.thinking i{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}

.preview{position:relative;height:196px;border-radius:28px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.preview svg{height:176px;width:auto}
.preview .tag{position:absolute;top:12px;left:16px;font-size:12px;font-weight:500;color:var(--muted)}
